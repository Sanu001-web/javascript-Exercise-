<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">


  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/videoDetails.css">
</head>

<body>

  <main class="video-details-page">
    <a href="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-circle-chevron-left-icon lucide-circle-chevron-left back-button">
        <circle cx="12" cy="12" r="10" />
        <path d="m14 16-4-4 4-4" />
      </svg>
    </a>
    <header class="header js-header"></header>

    <section class="video-player-section">
      <div class="video-player-wrapper">
        <iframe id="videoPlayer" class="video-player" title="Video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <section class="video-actions">
      <div class="channel-control-container">
        <div class="channel-control-left-container">
          <span id="profile-pic">profile-pic</span>
          <div class="connect-container">
            <span class="js-channel-author" id="channel-author">Marques Brownlee</span>
            <span id="subscriber-count">4.53m subscribers</span>
          </div>
          <!-- <button class="join-button js-join-button" id="join-btn" type="button">Join</button> -->
          <button class="subs-button subscribe-button js-subscribe-button js-subs-button" id="subscribe-btn" type="button">
          Subscribe
        </button>
          <button class="js-notification-bell" id="notification-btn">
          <svg xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24" 
            fill="none"
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            class="lucide lucide-bell-icon lucide-bell">
            <path d="M10.268 21a2 2 0 0 0 3.464 0"/>
            <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>
          </svg>
      </button>
        </div>
        <div class="channel-control-right-container">


          <button class="watch-later-button" id="watchLaterBtn" type="button">Watch Later</button>
          <!-- Like / Dislike -->
          <div class="video-actions-caontainer">
            <button class="like-dislike-container" type="submit">
              <div class="like-ccontainer">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-thumbs-up-icon lucide-thumbs-up">
                    <path
                      d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" />
                    <path d="M7 10v12" />
                  </svg>
                  <span>112k</span>
              </div>
             <hr />
                <svg xmlns="http://www.w3.org/2000/svg" width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor" 
                  stroke-width="2"
                  stroke-linecap="round" 
                  stroke-linejoin="round"
                  class="lucide lucide-thumbs-down-icon lucide-thumbs-down">
                  <path 
                  d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>
                  <path d="M17 14V2"/>
                </svg>
              
          </button>
          </div>


          <button class="share-button" id="shareBtn" type="button">
        <svg xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24" 
          fill="none"
          stroke="currentColor" 
          stroke-width="2" 
          stroke-linecap="round"
          stroke-linejoin="round" 
          class="lucide lucide-forward-icon lucide-forward">
          <path d="m15 17 5-5-5-5"/>
          <path d="M4 18v-2a4 4 0 0 1 4-4h12"/>
        </svg>
        Share
      </button>

          <button class="save-button" id="saveBtn" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" 
            width="20" 
            height="20" 
            viewBox="0 0 24 24"
            fill="none" 
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            class="lucide lucide-bookmark-icon lucide-bookmark">
            <path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/>
          </svg>
          Save
        </button>

          <button class="download-button" id="downloadBtn" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" 
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none" 
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-arrow-down-to-line-icon lucide-arrow-down-to-line">
              <path d="M12 17V3"/>
              <path d="m6 11 6 6 6-6"/>
              <path d="M19 21H5"/>
            </svg>
          Download
        </button>
        </div>
      </div>
    </section>
    <section class="video-information">

      <div class="video-badges" id="videoBadges"></div>

      <h1 id="videoTitle">Video Title</h1>

      <div class="video-meta">
        <span id="videoViews">0 views</span>
        <span id="videoUploadDate">Upload date</span>
        <span id="videoChannelId">Channel ID</span>
        <span id="videoDuration">00:00</span>
      </div>

      <p id="videoDescription">Video description</p>

    </section>


    <section id="shareOptions" class="share-options" hidden>
      <button type="button" id="copyLinkBtn">Copy Link</button>
      <button type="button" id="shareFacebookBtn">Facebook</button>
      <button type="button" id="shareTwitterBtn">X</button>
      <button type="button" id="shareWhatsAppBtn">WhatsApp</button>
    </section>

    <main class="video-page">


      <!-- Description -->
      <div class="description-container">

        <div id="video-description"></div>

        <button id="description-toggle">
        Show more
      </button>

      </div>

      <!-- Hashtags -->
      <div id="video-hashtags"></div>

      <!-- Transcript -->
      <button id="transcript-toggle">
      Show transcript
      </button>

      <div id="transcript" hidden>
        ...
      </div>

      </section>

      <!-- Comments -->
      <section class="comments-section">

        <h2>
          <span id="comment-count">0</span>
          Comments
        </h2>

        <select id="comment-sort">
      <option value="top">Top comments</option>
      <option value="newest">Newest first</option>
      </select>

        <div class="add-comment">
          <textarea
        id="comment-input"
        placeholder="Add a comment..."
      ></textarea>

          <button id="comment-submit">
        Comment
      </button>
        </div>

        <div id="comments-list"></div>

      </section>

    </main>


    <section class="related-videos-section">
      <h2>Related Videos</h2>
      <div id="relatedVideos" class="related-videos-grid"></div>
    </section>

  </main>
  <script src="scripts/header.js" type="module"></script>
  <script src="scripts/videoDetails.js" type="module"></script>
  <script src="scripts/sideBar.js" type="module"></script>

</body>

</html>
