<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Details</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/videoDetails.css">
</head>

<body>
  <main class="video-details-page">
    <a href="index.html" aria-label="Go back">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" class="back-button">
        <circle cx="12" cy="12" r="10" />
        <path d="m14 16-4-4 4-4" />
      </svg>
    </a>

    <header class="header js-header"></header>

    <section class="video-player-section">
      <div class="video-player-wrapper">
        <iframe id="videoPlayer" class="video-player" title="Video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>
      </div>
    </section>

    <section class="video-actions">
      <div class="channel-control-container">
        <div class="channel-control-left-container">
          <span id="profile-pic">profile-pic</span>

          <div class="connect-container">
            <span class="js-channel-author" id="channel-author">Marques Brownlee</span>
            <span id="subscriber-count">4.53m subscribers</span>
          </div>

          <button class="subs-button subscribe-button js-subscribe-button js-subs-button action-btns"
            id="subscribe-btn" type="button">
            Subscribe
          </button>

          <button class="js-notification-bell" id="notification-btn" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M10.268 21a2 2 0 0 0 3.464 0" />
              <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
            </svg>
          </button>
        </div>

        <div class="channel-control-right-container">
          <button class="watch-later-button action-btns" id="watchLaterBtn" type="button">Watch Later</button>

          <div class="video-actions-caontainer">
            <button class="like-btn feedback-btn" type="button">
              👍 <span class="like-count" id="js-like-count">112k</span>
            </button>

            <button class="dislike-btn feedback-btn" type="button">👎</button>
          </div>

          <button class="share-button action-btns" id="shareBtn" type="button">Share</button>
          <button class="save-button action-btns" id="saveBtn" type="button">Save</button>
          <button class="download-button action-btns" id="downloadBtn" type="button">Download</button>
          <button class="more-options-btn js-more-options-btn action-btns" type="button">•••</button>
          <span class="report-more-btn" id="js-report-option">Report</span>
        </div>
      </div>
    </section>

    <section class="video-information">
      <div class="video-badges" id="videoBadges"></div>
      <h1 id="videoTitle">Video Title</h1>

      <div class="video-meta">
        <span id="videoViews">0 views</span>
        <span id="videoUploadDate">Upload date</span>
        <span id="videoChannelId">Channel ID</span>
        <span id="videoDuration">00:00</span>
      </div>

      <p id="videoDescription">Video description</p>
    </section>

    <section id="shareOptions" class="share-options" hidden>
      <button type="button" id="copyLinkBtn">Copy Link</button>
      <button type="button" id="shareFacebookBtn">Facebook</button>
      <button type="button" id="shareTwitterBtn">X</button>
      <button type="button" id="shareWhatsAppBtn">WhatsApp</button>
    </section>

    <section class="video-page">
      <div class="description-container">
        <div id="video-description"></div>
        <button id="description-toggle" type="button">Show more</button>
      </div>

      <div id="video-hashtags"></div>

      <button id="transcript-toggle" type="button">Show transcript</button>

      <div id="transcript" hidden>...</div>

      <section class="comments-section">
        <div class="comments-header">
          <h2>
            <span id="comment-count" class="comments-count">0</span>
            Comments
          </h2>

          <select id="comment-sort" class="comments-sort" aria-label="Sort comments">
            <option value="top">Top comments</option>
            <option value="newest">Newest first</option>
          </select>
        </div>

        <div class="add-comment">
          <span class="current-user-avatar" aria-hidden="true">👤</span>

          <div class="comment-input-container">
            <textarea id="comment-input" class="comment-input"
              placeholder="Add a comment..."></textarea>

            <div class="comment-form-actions">
              <button id="comment-submit" class="comment-submit" type="button">
                Comment
              </button>
            </div>
          </div>
        </div>

        <div id="comments-list"></div>
      </section>
    </section>

    <section class="related-videos-section">
      <h2>Related Videos</h2>
      <div id="relatedVideos" class="related-videos-grid"></div>
    </section>
  </main>

  <script src="scripts/header.js" type="module"></script>
  <script src="scripts/videoDetails.js" type="module"></script>
  <script src="scripts/sideBar.js" type="module"></script>
</body>

</html>
