<!DOCTYPE html>
<html>

<head>
  <title>Tracking</title>

  <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Load a font called Roboto from Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Here are the CSS files for this page. -->
  <link rel="stylesheet" href="styles/general.css">
  <link rel="stylesheet" href="styles/amazon-header.css">
  <link rel="stylesheet" href="styles/tracking.css">
</head>

<body>
  <div class="amazon-header">
    <div class="amazon-header-left-section">
      <a href="index.html" class="header-link">
        <img class="amazon-logo"
            src="https://tinyurl.com/4b3h856y">
        <img class="amazon-mobile-logo"
            src="https://tinyurl.com/yxverk9n">
      </a>
    </div>

    <div class="amazon-header-middle-section">
      <input class="search-bar" type="text" placeholder="Search">

      <button class="search-button">
          <img class="search-icon" src="https://tinyurl.com/yc7anj8j">
        </button>
    </div>

    <div class="amazon-header-right-section">
      <a class="orders-link header-link" href="orders.html">
        <span class="returns-text">Returns</span>
        <span class="orders-text">& Orders</span>
      </a>

      <a class="cart-link header-link" href="checkout.html">
        <img class="cart-icon" src="https://tinyurl.com/mt5j99zr">
        <div class="cart-quantity js-cart-quantity-tracking">3</div>
        <div class="cart-text">Cart</div>
      </a>
    </div>
  </div>

  <div class="main">
    <div class="order-tracking js-order-tracking">
      <!-- nothing & everything on tracking.js -->
    </div>
  </div>

  <script type="module" src="scripts/tracking.js"></script>
</body>

</html>
